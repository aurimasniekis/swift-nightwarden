name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: Build & publish
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Test
        run: make test

      - name: Build app
        run: make dist VERSION="${GITHUB_REF_NAME#v}"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" build/Nightwarden-*.zip build/Nightwarden-*.zip.sha256 \
            --title "Nightwarden $GITHUB_REF_NAME" \
            --generate-notes \
            --verify-tag
